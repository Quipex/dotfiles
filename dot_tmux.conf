unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Russian layout duplicates (ЙЦУКЕН): physical keys produce Russian chars
# h->р j->о k->л l->д r->к ,->б .->ю " ->Э (Shift+')  % stays % (Shift+5)
bind-key р select-pane -L
bind-key о select-pane -D
bind-key л select-pane -U
bind-key д select-pane -R
bind-key к source-file ~/.tmux.conf
bind-key б command-prompt -I "#W" { rename-window "%%" }
bind-key ю command-prompt -T target { move-window -t "%%" }
bind-key Э split-window

# copy-mode-vi: same navigation in Russian
bind-key -T copy-mode-vi р send-keys -X cursor-left
bind-key -T copy-mode-vi о send-keys -X cursor-down
bind-key -T copy-mode-vi л send-keys -X cursor-up
bind-key -T copy-mode-vi д send-keys -X cursor-right
bind-key -T copy-mode-vi б send-keys -X jump-reverse

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Forward modern modified-key escape sequences (CSI-u) to applications.
# Needed for WezTerm -> tmux -> Hermes so Ctrl+J can be remapped to Hermes' newline handler.
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys,wezterm:extkeys'

# Keep manual window names (don't auto-rename)
set -g allow-rename off
setw -g automatic-rename off

# Show pane titles in border
set -g pane-border-status bottom
set -g pane-border-format "#{?pane_active,#[reverse],}#{pane_index}#[default] \"#{pane_title}\""
set -g pane-active-border-style "fg=#d08f3d,bg=#4c566a"
set -g pane-border-lines heavy

# Rename current pane
bind-key . command-prompt -I "#{pane_title}" -p "Pane title:" "select-pane -T '%%'"

set -g status-position bottom

# Configure the catppuccin plugin
# set -g @catppuccin_flavor "latte"
# set -g @catppuccin_window_status_style "rounded"
# set -g @catppuccin_window_text "#W"
# set -g @catppuccin_window_current_text "#W"

# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'o0th/tmux-nova'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left 
set -g @nova-nerdfonts-right 

set -g @nova-pane-active-border-style "#d08f3d"
set -g @nova-pane-border-style "#3b4252"
set -g @nova-status-style-bg "#4c566a"
set -g @nova-status-style-fg "#d8dee9"
set -g @nova-status-style-active-bg "#89c0d0"
set -g @nova-status-style-active-fg "#2e3540"
set -g @nova-status-style-double-bg "#2d3540"

set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"

set -g @nova-segment-mode "#{?client_prefix,Ω,ω}"
set -g @nova-segment-mode-colors "#78a2c1 #2e3440"

set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "#78a2c1 #2e3440"

set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right ""
# set -g @plugin 'catppuccin/tmux#v2.1.3'

# set -g status-right-length 100
# set -g status-left-length 100
# set -g status-left ""
# set -g status-right "#{E:@catppuccin_status_application}"
# set -ag status-right "#{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override nova's pane-active-border (must be after tpm load)
set -g pane-active-border-style "fg=#d08f3d,bg=#4c566a"
set -g pane-border-lines heavy